[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "erga-autopilot"
version = "0.1.0"
description = "Local, prepare-only recruiting automation with explicit authority boundaries"
requires-python = ">=3.12,<3.15"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "playwright>=1.55,<2", "mcp>=2,<3", "pyyaml>=6,<7", "psutil>=7,<8"]

[project.scripts]
autopilot = "erga_autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/erga_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
