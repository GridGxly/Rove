[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rove"
version = "0.1.0"
description = "Rove: local, prepare-only recruiting automation with explicit authority boundaries"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "mcp>=2,<3",
    "pyyaml>=6,<7",
    "psutil>=7,<8",
    "patchright>=1.63,<2",
    "cryptography>=45,<60",
]

[project.scripts]
rove = "rove.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/rove"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
