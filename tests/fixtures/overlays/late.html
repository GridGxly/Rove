<!doctype html>
<!-- Synthetic: the form behaves until its third field is focused, when a "save your
     progress" modal appears and covers everything below. -->
<html lang="en"><head><meta charset="utf-8"><title>Harborview Logistics - Apply</title>
<style>
  #save-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
  #save-modal.open { display: flex; }
  #save-modal .box { background: #fff; padding: 24px; width: 400px; }
</style></head>
<body>
<form id="application-form">
  <div><label for="first">First name</label><input id="first" name="first" required></div>
  <div><label for="last">Last name</label><input id="last" name="last" required></div>
  <div><label for="email">Email</label><input id="email" name="email" required></div>
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="authorized" value="yes"> Yes</label>
    <label><input type="radio" name="authorized" value="no"> No</label>
  </fieldset>
  <div><label for="city">City</label><input id="city" name="city"></div>
  <button type="submit">Submit application</button>
</form>
<div id="save-modal">
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sp">
    <h3 id="sp">Save your progress</h3>
    <p>Create an account to come back to this application later.</p>
    <button type="button" id="create">Create account</button>
    <button type="button" id="notnow">Not now</button>
  </div>
</div>
<script>
  let shown = false;
  document.getElementById('email').addEventListener('focus', () => {
    if (shown) return; shown = true;
    document.getElementById('save-modal').classList.add('open');
  });
  document.getElementById('notnow').addEventListener('click', () => document.getElementById('save-modal').remove());
  document.getElementById('create').addEventListener('click', () => { document.body.dataset.created = '1'; });
</script>
</body></html>
