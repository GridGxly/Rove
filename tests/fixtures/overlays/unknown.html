<!doctype html>
<!-- Synthetic: a pop-up whose buttons say nothing code recognises. Escape and clicks on
     the backdrop do nothing to it; only its own buttons take it away. -->
<html lang="en"><head><meta charset="utf-8"><title>Harborview Logistics - Apply</title>
<style>
  #keep-in-touch { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  #keep-in-touch .box { background: #fff; padding: 24px; width: 400px; }
</style></head>
<body>
<form id="application-form">
  <div><label for="first">First name</label><input id="first" name="first" required></div>
  <div><label for="email">Email</label><input id="email" name="email" required></div>
  <button type="submit">Submit application</button>
</form>
<div id="keep-in-touch">
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="kt">
    <h3 id="kt">We'd love to keep in touch</h3>
    <p>Hear from our recruiters about new openings.</p>
    <button type="button" id="signup">Yes, sign me up</button>
    <button type="button" id="browse">Keep browsing</button>
  </div>
</div>
<script>
  document.getElementById('browse').addEventListener('click', () => document.getElementById('keep-in-touch').remove());
  document.getElementById('signup').addEventListener('click', () => { document.body.dataset.signed = '1'; document.getElementById('keep-in-touch').remove(); });
</script>
</body></html>
