<!doctype html>
<!-- Synthetic: a chat bubble in the corner, drawn as a dialog, that covers nothing. -->
<html lang="en"><head><meta charset="utf-8"><title>Harborview Logistics - Apply</title>
<style>
  #chat-widget { position: fixed; right: 16px; bottom: 16px; width: 72px; height: 72px; border-radius: 50%; background: #06c; color: #fff; }
</style></head>
<body>
<form id="application-form">
  <div><label for="first">First name</label><input id="first" name="first" required></div>
  <div><label for="email">Email</label><input id="email" name="email" required></div>
  <button type="submit">Submit application</button>
</form>
<div id="chat-widget" role="dialog" aria-label="Chat with us"><button type="button">Chat</button></div>
</body></html>
