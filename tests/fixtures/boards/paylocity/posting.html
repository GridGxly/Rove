<!doctype html>
<!-- Reduced from a public Paylocity posting page (/Recruiting/Jobs/Details/{id}).
     Company, job and wording are invented; structure and class names are the board's. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Analytics - Junior Data Engineer</title>
  <style>.mobile-apply-btn { display: none; }</style>
</head>
<body class="citrus branding-background-color">
  <div class="container body-content" id="applicant-tracking" style="display: block;">
    <div class="ats-content-container branding-font">
      <div class="header-title" id="LayoutLogoSection" style="text-align: center;">
        <h2 id="LayoutLogoName">Northwind Analytics</h2>
      </div>
      <div class="row job-preview-header">
        <div class="preview-upper-apply-btn" data-automation-id="btnPublicApply">
          <a class="apply-link-marker button right model-full-width preview-button-color mobile-hidden apply-button branding-button-color" href="/Recruiting/Jobs/Apply/990001">Apply</a>
        </div>
        <span class="job-preview-title left"><span>Junior Data Engineer</span></span>
        <div class="preview-location"><span>Harborview, ST</span></div>
      </div>
      <div class="mobile-apply-btn">
        <a class="apply-link-marker button apply-button model-full-width branding-button-color" href="/Recruiting/Jobs/Apply/990001" style="width: 100%;">Apply</a>
      </div>
      <div class="job-listing-header">Description</div>
      <div data-bind="html: Job.Description"><p>Northwind Analytics builds reporting tools for regional libraries.</p></div>
      <div class="job-listing-header">Requirements</div>
      <div data-bind="html: Job.Requirements">
        <h2><strong>Key Responsibilities</strong></h2>
        <ul><li>Maintain nightly data loads</li><li>Write and review SQL</li></ul>
      </div>
      <div class="preview-bottom-apply-btn">
        <a autofocus="true" class="apply-link-marker button apply-button branding-button-color" href="/Recruiting/Jobs/Apply/990001" style="width: 100%;">Apply</a>
      </div>
      <aside aria-label="Powered by Paylocity Logo and Link">
        <div class="powered-by-paylo"><em>Powered by </em></div>
      </aside>
    </div>
  </div>
</body>
</html>
