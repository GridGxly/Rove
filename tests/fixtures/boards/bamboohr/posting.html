<!doctype html>
<!-- Reduced from a rendered public BambooHR posting ({employer}.bamboohr.com/careers/{n}).
     Company, job and wording are invented; structure and data-fabric-component hooks are
     the board's. The Apply control is a button that swaps the card in place. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BambooHR</title>
</head>
<body>
  <div id="js-careers-root">
    <main>
      <a href="/careers">Job Openings</a>
      <div class="fabric-1b2lyby-container">
        <div class="fabric-1igheb2-content">
          <h3 class="fabric-17nfaa3-root" data-fabric-component="Headline">Dispatch Coordinator</h3>
          <div class="fabric-dyjnxg-description">Operations - Harborview (Hybrid)</div>
        </div>
        <div>
          <button class="MuiButtonBase-root MuiButton-root fabric-1oxb2gi-Button-root" tabindex="0" type="button" data-fabric-component="Button"><span class="fabric-sipj72-Button-content">Apply for This Job</span></button>
        </div>
      </div>
      <hr class="MuiDivider-root" data-fabric-component="Divider">
      <div data-fabric-component="LayoutBox">
        <p class="fabric-1qjpysn-root" data-fabric-component="BodyText">Tidewater Systems schedules ferry maintenance crews.</p>
        <p class="fabric-1qjpysn-root" data-fabric-component="BodyText">You will keep the weekly rota and answer the dispatch line.</p>
      </div>
      <div data-fabric-component="LayoutBox">
        <p class="fabric-70g8c2-root" data-fabric-component="BodyText">Link to This Job</p>
        <input aria-invalid="false" id="FabricTextField-3" type="text" class="MuiInputBase-input Mui-readOnly MuiInputBase-readOnly" readonly value="https://tidewater.bamboohr.com/careers/17">
      </div>
    </main>
  </div>
</body>
</html>
