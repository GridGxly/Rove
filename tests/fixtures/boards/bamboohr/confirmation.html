<!doctype html>
<!-- The BambooHR result card, drawn in place at the posting's own URL once the send is
     accepted. No application was sent to see it: it is rebuilt from the confirmation
     component in the site's public careers bundle (headline, body text and wording).
     Company and job are invented. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BambooHR</title>
</head>
<body>
  <div id="js-careers-root">
    <main>
      <a href="/careers">Job Openings</a>
      <div class="fabric-1b2lyby-container">
        <div class="fabric-1igheb2-content">
          <h3 class="fabric-17nfaa3-root" data-fabric-component="Headline">Dispatch Coordinator</h3>
          <div class="fabric-dyjnxg-description">Operations - Harborview (Hybrid)</div>
        </div>
      </div>
      <hr class="MuiDivider-root" data-fabric-component="Divider">
      <div class="fabric-5qovnk-root MuiBox-root" data-fabric-component="Flex">
        <svg width="60" height="60" data-fabric-component="IconV2"></svg>
        <div class="fabric-5qovnk-root MuiBox-root" data-fabric-component="Flex">
          <h3 class="fabric-17nfaa3-root" data-fabric-component="Headline">Thank You</h3>
          <p class="fabric-1qjpysn-root" data-fabric-component="BodyText">Your application was submitted successfully</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
