<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Rove: one application, from job link to verified outcome</title>
  <desc id="description">A workflow illustration, not a product screenshot. Intake and fit lead to evidence-backed preparation and review. Code permits one frozen package to be sent, and records a confirmed or unknown outcome. Unknown facts and unresolved browser gates need the owner. Rove is pre-alpha; real end-to-end acceptance is unverified.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#112e51"/><stop offset="1" stop-color="#071420"/>
    </linearGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop stop-color="#173853"/><stop offset="1" stop-color="#102438"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#9ecee0" stroke-opacity=".04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#baf3e8" stroke-width="1.5"/>
    </marker>
    <style>
      text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf5fc}
      .label {font-size:16px;letter-spacing:3px;fill:#a7bdcf;font-weight:600}
      .heading {font-size:27px;font-weight:650}
      .body {font-size:21px;fill:#b9cddd}
      .small {font-size:18px;fill:#b9cddd}
      .mint {fill:#baf3e8}
      .line {stroke:#baf3e8;stroke-opacity:.7;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#background)"/>
  <rect width="1440" height="900" rx="28" fill="url(#grid)"/>
  <text x="64" y="94" style="font-family:Georgia,serif;font-size:62px" class="mint">Rove</text>
  <text x="1380" y="71" text-anchor="end" class="label">LOCAL-FIRST RECRUITING</text>
  <text x="1380" y="99" text-anchor="end" class="small">Workflow illustration · pre-alpha</text>
  <text x="64" y="177" style="font-size:40px;font-weight:600">One application. Every decision accounted for.</text>
  <text x="64" y="216" class="body">Qwen proposes. Approved evidence supplies the facts. Code controls the send.</text>

  <rect x="64" y="264" width="404" height="296" rx="18" fill="url(#card)" stroke="#4d7899"/>
  <rect x="518" y="264" width="404" height="296" rx="18" fill="url(#card)" stroke="#4d7899"/>
  <rect x="972" y="264" width="404" height="296" rx="18" fill="url(#card)" stroke="#4d7899"/>
  <path d="M 477 411 H 507" class="line"/>
  <path d="M 931 411 H 961" class="line"/>

  <text x="92" y="303" class="label mint">01 / FIND THE ROLE</text>
  <text x="92" y="350" class="heading">A link becomes a local job.</text>
  <text x="92" y="392" class="body">Discord link or configured feed</text>
  <text x="92" y="427" class="body">Deduplicate and check job fit</text>
  <path d="M 92 458 H 440" stroke="#4d7899"/>
  <text x="92" y="494" class="small">Approved profile + role requirements</text>
  <text x="92" y="525" class="small">Conflicts wait for the owner.</text>

  <text x="546" y="303" class="label mint">02 / PREPARE THE APPLICATION</text>
  <text x="546" y="350" class="heading">Evidence becomes a draft.</text>
  <text x="546" y="392" class="body">Erga resume + frozen profile</text>
  <text x="546" y="427" class="body">Fill, verify, and follow form steps</text>
  <path d="M 546 458 H 894" stroke="#4d7899"/>
  <text x="546" y="494" class="small">Qwen handles unfamiliar questions.</text>
  <text x="546" y="525" class="small">Missing facts remain questions.</text>

  <text x="1000" y="303" class="label mint">03 / VERIFY THE OUTCOME</text>
  <text x="1000" y="350" class="heading">One package. One send.</text>
  <text x="1000" y="392" class="body">Owner approval or explicit policy</text>
  <text x="1000" y="427" class="body">Confirmation and recovery checks</text>
  <path d="M 1000 458 H 1348" stroke="#4d7899"/>
  <text x="1000" y="494" class="small">An unclear result stays unknown.</text>
  <text x="1000" y="525" class="small">Code never blindly retries Submit.</text>

  <rect x="64" y="590" width="1312" height="115" rx="18" fill="#0c2033" stroke="#3a5a76"/>
  <text x="92" y="628" class="label mint">THE RECORD STAYS WITH YOU</text>
  <text x="92" y="671" class="body">Obsidian + QMD: readable memory</text>
  <text x="570" y="671" class="body">SQLite: exact state</text>
  <text x="941" y="671" class="body">Private files: original artifacts</text>

  <rect x="64" y="737" width="1312" height="110" rx="18" fill="#342e24" stroke="#8c7547"/>
  <text x="92" y="776" style="font-size:19px;font-weight:650;fill:#f3d49e">IMPLEMENTED DOES NOT MEAN VERIFIED END TO END</text>
  <text x="92" y="817" style="font-size:22px;fill:#f3d49e">0 verified full-game completions · 0 confirmed submissions for the seven selected validation jobs</text>
</svg>
